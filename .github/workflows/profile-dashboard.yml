name: Update profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub dashboard SVG
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          PROFILE_USERNAME: Archan47
        run: python3 scripts/generate_dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-dashboard.svg

          if git diff --cached --quiet; then
            echo "Dashboard is already up to date."
            exit 0
          fi

          git commit -m "chore: update profile dashboard"
          git push
